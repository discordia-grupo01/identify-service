openapi: 3.0.0
info:
  contact: {}
  description: >-
    Identity/auth service: registration, login (password, Google OAuth, device
    PIN), sessions, password recovery, email confirmation, profile.

    Routes under /v1/me and /v1/users require identity: the JWT is validated by Kong at the gateway (or by this service's own middleware.RequireAuth when hit directly).

    An account suspended by platform staff (discordia-admin) gets 403 ACCOUNT_SUSPENDED on every login path, on POST /v1/refresh and on every authenticated route (even with a still-valid access token); its public profile (GET /v1/users/{id}) is 404.
  title: Discordia - Identity
  version: 1.0.0
paths:
  /livez:
    get:
      responses:
        "200":
          description: ok
      summary: Liveness check
      tags:
        - ops
  /oauth/mobile-callback:
    get:
      description: Serves an HTML page that reads the `state`/`id_token` OAuth
        fragment and redirects to the app's exp:// (or discordia://) scheme --
        Google only accepts https:// redirect URIs, Expo Go only understands
        exp://.
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      summary: OAuth bounce page for the mobile app (Expo Go)
      tags:
        - oauth
  /readyz:
    get:
      description: Also pings the database.
      responses:
        "200":
          description: ready
        "503":
          description: database unavailable
      summary: Readiness check
      tags:
        - ops
  /v1/email-confirmation:
    post:
      description: Always responds 202 regardless of whether the email is registered
        or already confirmed. Rate-limited per email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.EmailConfirmationRequest"
        description: Email
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many requests for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Request an email confirmation link
      tags:
        - auth
  /v1/email-confirmation/confirm:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.EmailConfirmationTokenRequest"
        description: Confirmation token
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: invalid, expired, or already used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Confirm an email address using its token
      tags:
        - auth
  /v1/login:
    post:
      description: "Sets the refresh token as an httpOnly cookie; the response body
        only carries the access token (refresh_token is zeroed out). If the
        account has two-factor enabled, the credentials alone are not enough:
        the request is accepted (202) but not completed, no cookie is set, and
        the login is finished via POST /v1/login/2fa."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.LoginRequest"
        description: Email and password
        required: true
      responses:
        "200":
          description: "no two-factor on this account: session granted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "202":
          description: "two-factor enabled: accepted, continue at POST /v1/login/2fa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorChallengeResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: wrong email/password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: email not verified yet (EMAIL_NOT_VERIFIED), or the account is
            suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many failed login attempts; includes Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in with email and password
      tags:
        - auth
  /v1/login/2fa:
    post:
      description: "Second step of the login: takes the challenge_token from /v1/login
        and either a 6-digit code from the authenticator app or a recovery code
        -- same endpoint for both. On success, sets the refresh token as an
        httpOnly cookie and grants a session. The challenge allows up to 5
        attempts within 5 minutes; either limit exhausted means starting over
        from /v1/login."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.TwoFactorVerifyRequest"
        description: Challenge token plus a TOTP or recovery code
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorVerifyResponse"
        "400":
          description: missing challenge_token or code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: wrong/expired code, or the challenge itself expired/was already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: the account was suspended after the challenge was issued
            (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many failed attempts on this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Complete a login that requires two-factor
      tags:
        - two-factor
  /v1/login/2fa/recovery-request:
    post:
      description: For a user with 2FA on who lost both the authenticator app and
        every recovery code. Sent from the second step of the login with the
        challenge_token from /v1/login (or /v1/oauth/google), which proves the
        first factor; the challenge is not consumed, so the user can still go
        back and verify. The request stays pending until staff approves or
        rejects it from the back-office, and the user gets the answer by email.
        Only one pending request per user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.AccountRecoveryCreateRequest"
        description: Challenge token plus an optional message (up to 500 characters)
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AccountRecoveryCreateResponse"
        "400":
          description: missing challenge_token, or the message is longer than 500 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: the challenge expired, was already used or doesn't exist
            (TWO_FACTOR_CHALLENGE_EXPIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: the account is suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: the user already has a pending request
            (ACCOUNT_RECOVERY_ALREADY_PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Ask staff to recover an account that lost its second factor
      tags:
        - two-factor
  /v1/logout:
    post:
      description: Revokes the refresh token (read from the httpOnly cookie) and
        clears the cookie.
      responses:
        "204":
          description: no content
        "401":
          description: missing/invalid session cookie, or session expired
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Log out
      tags:
        - auth
  /v1/me/2fa:
    get:
      description: Whether 2FA is active, pending confirmation (QR requested but not
        scanned yet), or off, plus how many recovery codes are left.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get the account's two-factor status
      tags:
        - two-factor
  /v1/me/2fa/activate:
    post:
      description: Validates a code from the authenticator app against the pending
        secret. On success, activates 2FA and returns the one-time recovery
        codes -- they are shown here only, afterwards only their hash is kept.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.TwoFactorActivateRequest"
        description: 6-digit code from the authenticator app
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorRecoveryCodesResponse"
        "400":
          description: missing code, or the code is wrong/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: no pending setup, or 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Confirm the QR and activate two-factor authentication
      tags:
        - two-factor
  /v1/me/2fa/disable:
    post:
      description: Requires the account password again, so an already-open session (a
        borrowed laptop, a forgotten tab) can't strip 2FA from the account by
        itself. Login stops requesting the second factor right away.
      requestBody:
        $ref: "#/components/requestBodies/model.TwoFactorPasswordRequest"
      responses:
        "204":
          description: 2FA disabled
        "400":
          description: missing password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: wrong password -- not 401, so the front doesn't treat it as an
            expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: 2FA is not enabled on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Disable two-factor authentication
      tags:
        - two-factor
  /v1/me/2fa/recovery-codes:
    post:
      description: "Requires the account password again. Replaces the whole list:
        every previous recovery code, used or not, stops working. Recommended
        after using one."
      requestBody:
        $ref: "#/components/requestBodies/model.TwoFactorPasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorRecoveryCodesResponse"
        "400":
          description: missing password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: 2FA is not enabled on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Regenerate the recovery code list
      tags:
        - two-factor
  /v1/me/2fa/setup:
    post:
      description: Generates a TOTP secret and returns the otpauth:// URI for the
        front to render as a QR. 2FA stays off until a code is confirmed via
        /v1/me/2fa/activate. Calling this twice while pending reuses the same
        secret instead of rotating it. Requires the account to already have a
        password (POST /v1/me/password first) -- otherwise there'd be no way to
        re-enter it later to disable 2FA or regenerate recovery codes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorSetupResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: 2FA is already enabled on this account, or the account has no
            password yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Start setting up two-factor authentication
      tags:
        - two-factor
  /v1/me/password:
    post:
      description: "For an account that never had one (a purely federated Google
        sign-up): lets it configure a password so it can later re-enter it to
        disable two-factor or regenerate recovery codes. Rejected if the account
        already has a password -- this is not a change-password endpoint."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SetPasswordRequest"
        description: New password
        required: true
      responses:
        "204":
          description: no content
        "400":
          description: missing password, or insecure password
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: the account already has a password
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set the account's initial password
      tags:
        - auth
  /v1/me/profile:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get my own profile
      tags:
        - profile
    patch:
      description: Multipart form, all fields optional -- omitted fields are left unchanged.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: New display name
                  type: string
                description:
                  description: New description
                  type: string
                image:
                  description: New profile image (JPEG, PNG or WebP, up to 5 MiB)
                  type: string
                  format: binary
                remove_image:
                  description: Remove the current profile image
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid name/description/image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit my own profile
      tags:
        - profile
  /v1/me/status:
    delete:
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Clear my custom status
      tags:
        - profile
    put:
      description: A nil field means "don't touch it"; an empty string means "clear it".
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.StatusUpdateRequest"
        description: Status text and/or emoji
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid text/emoji, or no changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set my custom status
      tags:
        - profile
  /v1/oauth/google:
    post:
      description: "CA1: creates a new account if the email is new. CA2: links to an
        existing account by email. CA3: 503 if Google is unreachable, so the
        client can offer email/password login instead. If the resolved account
        has two-factor enabled, the login is accepted (202) but not completed,
        no cookie is set, and it's finished via POST /v1/login/2fa."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.googleLoginRequest"
        description: Google ID token
        required: true
      responses:
        "200":
          description: "no two-factor on this account: session granted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "202":
          description: "two-factor enabled: accepted, continue at POST /v1/login/2fa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorChallengeResponse"
        "400":
          description: missing id_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: token could not be validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: the account is suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "503":
          description: Google unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in / sign up with Google
      tags:
        - auth
  /v1/password-recovery:
    post:
      description: Always responds 202 regardless of whether the email is registered
        (doesn't leak which emails exist). Rate-limited per email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PasswordRecoveryRequest"
        description: Email
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many requests for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Request a password recovery email
      tags:
        - auth
  /v1/password-reset:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PasswordResetRequest"
        description: Token, new password and confirmation
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: passwords don't match, insecure password, or invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Reset the password using a recovery token
      tags:
        - auth
  /v1/pin:
    post:
      description: Lets the caller log back in on this device with a short PIN instead
        of the full password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.ConfigurePinRequest"
        description: Device ID and PIN (6-8 digits)
        required: true
      responses:
        "204":
          description: no content
        "400":
          description: missing fields, or PIN not 6-8 digits
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set up a device PIN
      tags:
        - auth
  /v1/pin/login:
    post:
      description: "Alternative to email/password for a device that already configured
        a PIN. If the account has two-factor enabled, the PIN alone is not
        enough: the request is accepted (202) but not completed, no cookie is
        set, and the login is finished via POST /v1/login/2fa. After too many
        wrong PINs in a row, the device is temporarily locked out of PIN login
        (423) and must fall back to POST /v1/login with email and password."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PinLoginRequest"
        description: Device ID and PIN
        required: true
      responses:
        "200":
          description: "no two-factor on this account: session granted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "202":
          description: "two-factor enabled: accepted, continue at POST /v1/login/2fa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.TwoFactorChallengeResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: PIN not configured, incorrect, or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: email not verified yet (EMAIL_NOT_VERIFIED), or the account is
            suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "423":
          description: "too many failed PIN attempts: temporarily locked, fall back to
            email+password"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in with a device PIN
      tags:
        - auth
  /v1/refresh:
    post:
      description: Reads the refresh token from the httpOnly cookie (no bearer token
        needed -- this is how you get a new access token once the old one
        expired). Rotates the refresh token and resets the cookie.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "401":
          description: missing, invalid, reused, or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: the account is suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Refresh the access token
      tags:
        - auth
  /v1/users:
    post:
      description: Does NOT create a session (no token returned) -- register
        separately, then log in.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.RegisterRequest"
        description: Name, email and password
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid input, or insecure password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Register a new account
      tags:
        - auth
  "/v1/users/{id}":
    get:
      description: Only the fields listed as public (name, photo, description, status,
        mutual servers) -- never email or registration date.
      parameters:
        - description: Target user's ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.PublicUserResponse"
        "400":
          description: invalid user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: the caller's own account is suspended (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: no such user, or the user is suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get another user's public profile
      tags:
        - profile
