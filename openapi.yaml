openapi: 3.0.3
info:
  title: Discordia - SERVICIO
  version: "1.0.0"
paths:
  /v1/users:
    post:
      summary: Registrar un usuario
      description: Crea una cuenta nueva. Para autenticarse se debe usar el endpoint de login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: Datos inválidos o contraseña insegura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: El correo electrónico ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400": { description: Datos de entrada inválidos }
        "401": { description: Credenciales inválidas }
        "500": { description: Error interno }
  /v1/logout:
    post:
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      responses:
        "204": { description: Sesión invalidada }
        "401": { description: Sesión expirada o inválida }
        "500": { description: Error interno }
  /v1/password-recovery:
    post:
      summary: Solicitar recuperación de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        "202": { description: Respuesta genérica, exista o no el correo }
        "400": { description: Datos de entrada inválidos }
        "429": { description: Límite de solicitudes excedido }
        "500": { description: Error interno }
  /v1/password-reset:
    post:
      summary: Definir una nueva contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        "200": { description: Contraseña actualizada y enlace invalidado }
        "400": { description: Contraseña inválida o enlace expirado/usado }
        "500": { description: Error interno }
  /v1/me/profile:
    get:
      summary: Obtener el perfil del usuario autenticado
      description: Devuelve la información del perfil correspondiente al token Bearer provisto.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "401":
          description: Sesión inválida o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Usuario inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Editar el perfil del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400": { description: Datos de perfil o imagen inválidos }
        "401": { description: Sesión inválida o expirada }
        "404": { description: Usuario inexistente }
        "500": { description: Error interno }
  /v1/me/status:
    put:
      summary: Fijar o actualizar el estado personalizado del usuario autenticado
      description: Cada campo es independiente entre sí. Omitir un campo lo deja sin cambios; enviarlo como cadena vacía lo limpia. Al menos uno de los dos debe estar presente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400": { description: JSON inválido, ningún campo presente, o texto/emoji inválido }
        "401": { description: Sesión inválida o expirada }
        "404": { description: Usuario inexistente }
        "500": { description: Error interno }
    delete:
      summary: Limpiar el estado personalizado del usuario autenticado
      description: Operación idempotente: borrar un estado ya vacío también responde 204.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Estado limpiado }
        "401": { description: Sesión inválida o expirada }
        "404": { description: Usuario inexistente }
        "500": { description: Error interno }
  /v1/users/{id}:
    get:
      summary: Obtener el perfil público de un usuario
      description: Devuelve los campos públicos del usuario indicado (nombre, descripción, avatar, estado, fecha de registro). No incluye email.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Perfil público obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        "400":
          description: El id no es un UUID válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Sesión inválida o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Usuario inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /livez:
    get:
      summary: Liveness check
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness check
      responses:
        "200": { description: OK }
        "503": { description: Dependencias no disponibles }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: Debe incluir al menos una mayúscula, una minúscula y un número.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [token, new_password, confirm_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        token: { type: string }
    UserResponse:
      type: object
      required: [id, name, email, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        description: { type: string, maxLength: 500 }
        avatar_url: { type: string, format: uri }
        status_text: { type: string, maxLength: 128 }
        status_emoji: { type: string, maxLength: 32 }
        created_at: { type: string, format: date-time }
    PublicUserResponse:
      type: object
      required: [id, name, avatar_url, created_at, mutual_server_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, maxLength: 500 }
        avatar_url: { type: string, format: uri }
        status_text: { type: string, maxLength: 128 }
        status_emoji: { type: string, maxLength: 32 }
        created_at: { type: string, format: date-time }
        mutual_server_ids:
          type: array
          items: { type: string, format: uuid }
          description: IDs de los servidores que el usuario autenticado (viewer) comparte con este usuario. No incluye nombre ni ícono del servidor (se resuelven aparte contra discordia-servers). Vacío si no comparten ninguno o si viewer == target.
    StatusUpdateRequest:
      type: object
      description: Al menos uno de los dos campos debe estar presente. Omitir un campo lo deja sin cambios; enviarlo como cadena vacía lo limpia.
      properties:
        status_text:
          type: string
          maxLength: 128
          description: Sin caracteres de control.
        status_emoji:
          type: string
          maxLength: 32
          description: Sin caracteres de control.
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Letras Unicode, números, espacios, apóstrofes, guiones y puntos.
        description:
          type: string
          maxLength: 500
        image:
          type: string
          format: binary
          description: Imagen JPEG, PNG o GIF de hasta 5 MiB y 4096x4096 píxeles.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
