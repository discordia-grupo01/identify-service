openapi: 3.0.0
info:
  contact: {}
  description: >-
    Identity/auth service: registration, login (password, Google OAuth, device
    PIN), sessions, password recovery, email confirmation, profile.

    Routes under /v1/me and /v1/users require identity: the JWT is validated by Kong at the gateway (or by this service's own middleware.RequireAuth when hit directly).
  title: Discordia - Identity
  version: 1.0.0
paths:
  /livez:
    get:
      responses:
        "200":
          description: ok
      summary: Liveness check
      tags:
        - ops
  /oauth/mobile-callback:
    get:
      description: Serves an HTML page that reads the `state`/`id_token` OAuth
        fragment and redirects to the app's exp:// (or discordia://) scheme --
        Google only accepts https:// redirect URIs, Expo Go only understands
        exp://.
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      summary: OAuth bounce page for the mobile app (Expo Go)
      tags:
        - oauth
  /readyz:
    get:
      description: Also pings the database.
      responses:
        "200":
          description: ready
        "503":
          description: database unavailable
      summary: Readiness check
      tags:
        - ops
  /v1/email-confirmation:
    post:
      description: Always responds 202 regardless of whether the email is registered
        or already confirmed. Rate-limited per email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.EmailConfirmationRequest"
        description: Email
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many requests for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Request an email confirmation link
      tags:
        - auth
  /v1/email-confirmation/confirm:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.EmailConfirmationTokenRequest"
        description: Confirmation token
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: invalid, expired, or already used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Confirm an email address using its token
      tags:
        - auth
  /v1/login:
    post:
      description: Sets the refresh token as an httpOnly cookie; the response body
        only carries the access token (refresh_token is zeroed out).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.LoginRequest"
        description: Email and password
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: wrong email/password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: email not verified yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in with email and password
      tags:
        - auth
  /v1/logout:
    post:
      description: Revokes the refresh token (read from the httpOnly cookie) and
        clears the cookie.
      responses:
        "204":
          description: no content
        "401":
          description: missing/invalid session cookie, or session expired
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Log out
      tags:
        - auth
  /v1/me/profile:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get my own profile
      tags:
        - profile
    patch:
      description: Multipart form, all fields optional -- omitted fields are left unchanged.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: New display name
                  type: string
                description:
                  description: New description
                  type: string
                image:
                  description: New profile image
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid name/description/image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit my own profile
      tags:
        - profile
  /v1/me/status:
    delete:
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Clear my custom status
      tags:
        - profile
    put:
      description: A nil field means "don't touch it"; an empty string means "clear it".
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.StatusUpdateRequest"
        description: Status text and/or emoji
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid text/emoji, or no changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set my custom status
      tags:
        - profile
  /v1/oauth/google:
    post:
      description: "CA1: creates a new account if the email is new. CA2: links to an
        existing account by email. CA3: 503 if Google is unreachable, so the
        client can offer email/password login instead."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.googleLoginRequest"
        description: Google ID token
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "400":
          description: missing id_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: token could not be validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "503":
          description: Google unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in / sign up with Google
      tags:
        - auth
  /v1/password-recovery:
    post:
      description: Always responds 202 regardless of whether the email is registered
        (doesn't leak which emails exist). Rate-limited per email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PasswordRecoveryRequest"
        description: Email
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "429":
          description: too many requests for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Request a password recovery email
      tags:
        - auth
  /v1/password-reset:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PasswordResetRequest"
        description: Token, new password and confirmation
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: passwords don't match, insecure password, or invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Reset the password using a recovery token
      tags:
        - auth
  /v1/pin:
    post:
      description: Lets the caller log back in on this device with a short PIN instead
        of the full password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.ConfigurePinRequest"
        description: Device ID and PIN (6-8 digits)
        required: true
      responses:
        "204":
          description: no content
        "400":
          description: missing fields, or PIN not 6-8 digits
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set up a device PIN
      tags:
        - auth
  /v1/pin/login:
    post:
      description: Alternative to email/password for a device that already configured a PIN.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.PinLoginRequest"
        description: Device ID and PIN
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: PIN not configured, incorrect, or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: email not verified yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Log in with a device PIN
      tags:
        - auth
  /v1/refresh:
    post:
      description: Reads the refresh token from the httpOnly cookie (no bearer token
        needed -- this is how you get a new access token once the old one
        expired). Rotates the refresh token and resets the cookie.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.AuthResponse"
        "401":
          description: missing, invalid, reused, or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Refresh the access token
      tags:
        - auth
  /v1/users:
    post:
      description: Does NOT create a session (no token returned) -- register
        separately, then log in.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.RegisterRequest"
        description: Name, email and password
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.UserResponse"
        "400":
          description: invalid input, or insecure password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "409":
          description: email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      summary: Register a new account
      tags:
        - auth
  "/v1/users/{id}":
    get:
      description: Only the fields listed as public (name, photo, description, status,
        mutual servers) -- never email or registration date.
      parameters:
        - description: Target user's ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.PublicUserResponse"
        "400":
          description: invalid user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get another user's public profile
      tags:
        - profile
servers:
  - url: /
components:
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and the JWT.
      in: header
      name: Authorization
      type: apiKey
  schemas:
    handler.googleLoginRequest:
      properties:
        id_token:
          type: string
      required:
        - id_token
      type: object
    model.APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          type: string
      type: object
    model.AuthResponse:
      properties:
        refresh_token:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/model.UserResponse"
      type: object
    model.ConfigurePinRequest:
      properties:
        device_id:
          type: string
        pin:
          type: string
      required:
        - device_id
        - pin
      type: object
    model.EmailConfirmationRequest:
      properties:
        email:
          type: string
      required:
        - email
      type: object
    model.EmailConfirmationTokenRequest:
      properties:
        token:
          type: string
      required:
        - token
      type: object
    model.ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/model.APIError"
      type: object
    model.LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    model.PasswordRecoveryRequest:
      properties:
        email:
          type: string
      required:
        - email
      type: object
    model.PasswordResetRequest:
      properties:
        confirm_password:
          type: string
        new_password:
          type: string
        token:
          type: string
      required:
        - confirm_password
        - new_password
        - token
      type: object
    model.PinLoginRequest:
      properties:
        device_id:
          type: string
        pin:
          type: string
      required:
        - device_id
        - pin
      type: object
    model.PublicUserResponse:
      properties:
        avatar_url:
          type: string
        description:
          type: string
        id:
          type: string
        mutual_server_ids:
          items:
            type: string
          type: array
        name:
          type: string
        status_emoji:
          type: string
        status_text:
          type: string
      type: object
    model.RegisterRequest:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
      required:
        - email
        - name
        - password
      type: object
    model.StatusUpdateRequest:
      properties:
        status_emoji:
          type: string
        status_text:
          type: string
      type: object
    model.UserResponse:
      properties:
        avatar_url:
          type: string
        created_at:
          type: string
        description:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        id:
          type: string
        name:
          type: string
        status_emoji:
          type: string
        status_text:
          type: string
      type: object
