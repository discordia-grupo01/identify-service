name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: discordia
      DATABASE_PASSWORD: discordia
      DATABASE_NAME: discordia_servicio
      DATABASE_SSLMODE: disable
      JWT_SECRET: ci-test-secret
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - name: Instalar golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
      - name: Migrar la base de test
        run: migrate -path=migrations -database "postgres://$DATABASE_USER:$DATABASE_PASSWORD@$DATABASE_HOST:$DATABASE_PORT/$DATABASE_NAME?sslmode=$DATABASE_SSLMODE" up
      - run: go test ./... -cover
